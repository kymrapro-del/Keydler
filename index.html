<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keydler: a shared memory for you and your AI</title>
    <meta
      name="description"
      content="Keydler keeps completed work, rules to follow, and mistakes not to repeat, and exposes them to your agent over WebMCP. Browser-local: no account, no server."
    />
    <link rel="canonical" href="https://keydler.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keydler" />
    <meta property="og:title" content="Keydler: a shared memory for you and your AI" />
    <meta
      property="og:description"
      content="Completed work, rules to follow, and mistakes not to repeat, read and written by your agent over WebMCP, and supervised by you. Nothing leaves the browser."
    />
    <meta property="og:url" content="https://keydler.com/" />
    <meta property="og:image" content="https://keydler.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Keydler: a shared memory for you and your AI." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#fbf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11131b" media="(prefers-color-scheme: dark)" />
    <script>
      // Before the first paint, read here and not in the module. Otherwise
      // the page would show for a fraction of a second in the system theme
      // before switching.
      try {
        var t = localStorage.getItem('watch-log.theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div
      id="announcements"
      class="visually-hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="app"></div>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Material Design 3 : Roboto is the type scale's typeface, Material Symbols
      the icon set. `display=swap` on the text face shows the fallback while it
      loads; `display=block` on the icon face hides the glyph slot instead,
      because the fallback for an icon ligature is its own name, and a page
      briefly reading `arrow_forward` in words is worse than a blank of the
      same size.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
