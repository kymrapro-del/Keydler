<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keydler — a shared memory for you and your AI</title>
    <meta
      name="description"
      content="Keydler keeps completed work, rules to follow, and mistakes not to repeat, and exposes them to your agent over WebMCP. Browser-local: no account, no server."
    />
    <link rel="canonical" href="https://keydler.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keydler" />
    <meta property="og:title" content="Keydler — a shared memory for you and your AI" />
    <meta
      property="og:description"
      content="Completed work, rules to follow, and mistakes not to repeat — read and written by your agent over WebMCP, and supervised by you. Nothing leaves the browser."
    />
    <meta property="og:url" content="https://keydler.com/" />
    <meta property="og:image" content="https://keydler.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Keydler — a shared memory for you and your AI." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)" />
    <script>
      // Avant la première peinture : lu ici et non dans le module, faute de
      // quoi la page s'afficherait une fraction de seconde dans le thème du
      // système avant de basculer.
      try {
        var t = localStorage.getItem('watch-log.theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div
      id="annonces"
      class="visually-hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
