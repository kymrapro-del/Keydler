name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run check` and nothing else. Spelling out the steps here made them
      # drift: this file was still running a bare `vite build`, so without the
      # artifact guard or the link checker that `check` ended up containing.
      # A badge sitting on a CI weaker than the local command lies.
      - name: check
        run: ALLOW_NO_ORIGIN_TRIAL=1 npm run check

      # The trial build serves the measurement campaigns: it must never
      # produce a source map, otherwise a "browser only" agent reads all the
      # code again and the isolation of the trial is lost.
      - name: Trial build without a source map
        run: |
          ALLOW_NO_ORIGIN_TRIAL=1 npm run build:trial
          if ls dist/assets/*.map 2>/dev/null; then
            echo "The trial build produced a source map." >&2
            exit 1
          fi
