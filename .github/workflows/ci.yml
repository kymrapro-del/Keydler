name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exactement ce que `npm run check` exécute en local : un échec ici doit
      # toujours être reproductible sur la machine de qui a poussé.
      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests d'invariants
        run: npm test

      - name: Build de production
        run: npx vite build

      # Le build d'essai sert les campagnes de mesure : il ne doit jamais
      # produire de carte de source, faute de quoi un agent « navigateur seul »
      # relit tout le code et l'isolement de l'essai est perdu.
      - name: Build d'essai sans carte de source
        run: |
          npm run build:trial
          if ls dist/assets/*.map 2>/dev/null; then
            echo "Le build d'essai a produit une carte de source." >&2
            exit 1
          fi
