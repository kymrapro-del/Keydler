name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run check` et rien d'autre. Détailler les étapes ici les faisait
      # dériver : ce fichier lançait encore `vite build` nu, donc sans le garde
      # d'artefact ni le vérificateur de liens que `check` a fini par contenir.
      # Un badge posé sur un CI plus faible que la commande locale ment.
      - name: check
        run: ALLOW_NO_ORIGIN_TRIAL=1 npm run check

      # Le build d'essai sert les campagnes de mesure : il ne doit jamais
      # produire de carte de source, faute de quoi un agent « navigateur seul »
      # relit tout le code et l'isolement de l'essai est perdu.
      - name: Build d'essai sans carte de source
        run: |
          ALLOW_NO_ORIGIN_TRIAL=1 npm run build:trial
          if ls dist/assets/*.map 2>/dev/null; then
            echo "Le build d'essai a produit une carte de source." >&2
            exit 1
          fi
